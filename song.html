<script>
const $=id=>document.getElementById(id);
$('yr').textContent=new Date().getFullYear();
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* настройки страницы — только в этом браузере */
let prefs={};try{prefs=JSON.parse(localStorage.getItem('dgc_site')||'{}');}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('dgc_site',JSON.stringify(prefs));}catch(e){}};

/* ===== аккорды: разбор, транспонирование, схемы ===== */
const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11,H:11};
const SHARP=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
function parseChord(name){const m=String(name).trim().match(/^([A-H])([#b]?)(.*)$/);if(!m)return null;return {pc:(PC[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+12)%12,q:m[3]};}
function transposeChord(name,st){if(!st)return name;return name.split('/').map(p=>{const c=parseChord(p);return c?SHARP[(c.pc+st+120)%12]+c.q:p;}).join('/');}
const normQ=q=>q.replace(/^min$/,'m').replace(/^maj$/,'').replace(/^-$/,'m');
const OPEN={
  'C':[-1,3,2,0,1,0],'A':[-1,0,2,2,2,0],'G':[3,2,0,0,0,3],'E':[0,2,2,1,0,0],'D':[-1,-1,0,2,3,2],
  'Am':[-1,0,2,2,1,0],'Em':[0,2,2,0,0,0],'Dm':[-1,-1,0,2,3,1],
  'E7':[0,2,0,1,0,0],'A7':[-1,0,2,0,2,0],'D7':[-1,-1,0,2,1,2],'G7':[3,2,0,0,0,1],'C7':[-1,3,2,3,1,0],'B7':[-1,2,1,2,0,2],
  'Am7':[-1,0,2,0,1,0],'Em7':[0,2,0,0,0,0],'Dm7':[-1,-1,0,2,1,1],
  'F':[1,3,3,2,1,1],'Fm':[1,3,3,1,1,1],'Bm':[-1,2,4,4,3,2],'Cmaj7':[-1,3,2,0,0,0],'Fmaj7':[-1,-1,3,2,1,0],
  'Asus4':[-1,0,2,2,3,0],'Gsus4':[3,3,0,0,1,3],'Csus4':[-1,3,3,0,1,1],'Dsus4':[-1,-1,0,2,3,3],'Esus4':[0,2,2,2,0,0],'Asus2':[-1,0,2,2,0,0],'Dsus2':[-1,-1,0,2,3,0],
};
const BARRE={E:{'':[0,2,2,1,0,0],m:[0,2,2,0,0,0],'7':[0,2,0,1,0,0],m7:[0,2,0,0,0,0]},A:{'':[-1,0,2,2,2,0],m:[-1,0,2,2,1,0],'7':[-1,0,2,0,2,0],m7:[-1,0,2,0,1,0]}};
function chordShape(name){
  const c=parseChord(name.split('/')[0]);if(!c)return null;
  const q=normQ(c.q),key=SHARP[c.pc]+q;
  if(OPEN[key])return OPEN[key];
  if(!(q in BARRE.E))return null;
  const fe=(c.pc-4+12)%12||12,fa=(c.pc-9+12)%12||12;
  const [shape,fr]=fe<=fa?[BARRE.E[q],fe]:[BARRE.A[q],fa];
  return shape.map(x=>x<0?-1:x+fr);
}
function chordSVG(name,label=true){
  const f=chordShape(name);
  if(!f)return `<svg viewBox="0 0 62 76"><text x="31" y="44" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">нет схемы</text>${label?`<text x="31" y="72" text-anchor="middle" font-size="12" font-weight="800" fill="currentColor">${esc(name)}</text>`:''}</svg>`;
  const pos=f.filter(x=>x>0),max=Math.max(0,...pos),min=pos.length?Math.min(...pos):1,base=max<=4?1:min;
  const X=i=>9+i*9,Y=k=>14+k*10;let g='';
  for(let k=0;k<=5;k++)g+=`<line x1="9" x2="54" y1="${Y(k)}" y2="${Y(k)}" stroke="currentColor" stroke-width="${k===0&&base===1?2.6:1}" opacity="${k===0&&base===1?1:.55}"/>`;
  for(let i=0;i<6;i++)g+=`<line x1="${X(i)}" x2="${X(i)}" y1="14" y2="64" stroke="currentColor" stroke-width="1" opacity=".55"/>`;
  let barreFr=0,barreX=31,barreA=-1,barreB=-1;const played=f.map((v,i)=>[v,i]).filter(([v])=>v>=0);
  if(min>0&&played.length>=4){const onMin=played.filter(([v])=>v===min).map(([,i])=>i),first=played[0][1],last=played[played.length-1][1];
    if(onMin.includes(first)&&onMin.includes(last)&&onMin.length>=2)barreFr=min,barreX=(X(first)+X(last))/2,barreA=first,barreB=last,g+=`<rect x="${X(first)-3}" y="${Y(min-base)+2}" width="${X(last)-X(first)+6}" height="6" rx="1.5" fill="#F0A830"/>`;}
  f.forEach((v,i)=>{
    if(v<0)g+=`<text x="${X(i)}" y="10" text-anchor="middle" font-size="8" font-weight="800" fill="currentColor" opacity=".75">✕</text>`;
    else if(v===0)g+=`<circle cx="${X(i)}" cy="7.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.2"/>`;
    else if(!(barreFr&&v===barreFr&&i>=barreA&&i<=barreB))g+=`<circle cx="${X(i)}" cy="${Y(v-base)+5}" r="3.6" fill="#F0A830"/>`;});
  if(base>1&&!barreFr)g+=`<text x="58" y="${Y(0)+8}" font-size="7.5" font-weight="800" fill="currentColor">${base}</text>`;
  // баррэ: под схемой — номер лада
  const bh=barreFr?9:0;
  if(barreFr)g+=`<text x="${barreX}" y="73" text-anchor="middle" font-size="8.5" font-weight="800" fill="currentColor">${barreFr}</text>`;
  if(label)g+=`<text x="31" y="${74+bh}" text-anchor="middle" font-size="11" font-weight="800" fill="currentColor">${esc(name)}</text>`;
  return `<svg viewBox="0 0 66 ${(label?78:68)+bh}">${g}</svg>`;
}
const chordsIn=t=>[...new Set([...(t||'').matchAll(/\[([^\]]+)\]/g)].map(m=>m[1].trim()).filter(x=>parseChord(x)))];

/* ===== звук аккорда: семплы акустики ===== */
const SAMPLES='A2 A3 A4 As2 As3 As4 B2 B3 B4 C3 C4 C5 Cs3 Cs4 Cs5 D2 D3 D4 D5 Ds2 Ds3 Ds4 E2 E3 E4 F2 F3 F4 Fs2 Fs3 Fs4 G2 G3 G4 Gs2 Gs3 Gs4'.split(' ');
const NPC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const smidi=n=>{const m=n.match(/^([A-G])(s?)(\d)$/);return 12*(+m[3]+1)+NPC[m[1]]+(m[2]?1:0);};
const OPENM=[40,45,50,55,59,64]; // E2 A2 D3 G3 B3 E4
let actx=null;const bank=new Map();
function ctx(){if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();SAMPLES.forEach(n=>fetch(`samples/acoustic/${n}.mp3`).then(r=>r.arrayBuffer()).then(b=>new Promise((res,rej)=>actx.decodeAudioData(b,res,rej))).then(buf=>bank.set(smidi(n),buf)).catch(()=>{}));}if(actx.state==='suspended')actx.resume();return actx;}
function playMidi(m,when){
  const a=ctx();let best=null,d=99;for(const k of bank.keys()){const x=Math.abs(k-m);if(x<d){d=x;best=k;}}
  if(best===null)return;
  const s=a.createBufferSource(),gn=a.createGain();s.buffer=bank.get(best);s.playbackRate.value=Math.pow(2,(m-best)/12);
  gn.gain.value=.7;s.connect(gn).connect(a.destination);s.start(a.currentTime+when);
}
function strumChord(name){const f=chordShape(name);if(!f)return;ctx();setTimeout(()=>f.forEach((fr,c)=>{if(fr>=0)playMidi(OPENM[c]+fr,c*.035);}),bank.size?0:400);}

/* ===== страница песни ===== */
let SONG=null;const st={tr:0,fs:prefs.fs||19,scroll:0,raf:0};
function renderChordsPage(){
  $('content').innerHTML=`
    <div class="shead"><div>
      <div class="badges">${SONG.exclusive?'<span class="type ex">★ Эксклюзив</span>':''}<span class="type ch">Аккорды</span><span class="type ver">✓ проверено ditrihh</span></div>
      <h1>${esc(SONG.title)}</h1><div class="by">${esc(SONG.artist||'')}</div></div></div>
    <div class="panel">
      <div class="bar">
        <div class="grp"><button class="ib" id="trDown" aria-label="Тон ниже">−</button><span id="trLabel">Тон</span><button class="ib" id="trUp" aria-label="Тон выше">+</button></div>
        <div class="grp"><button class="ib" id="fsDown" aria-label="Мельче">A−</button><button class="ib" id="fsUp" aria-label="Крупнее">A+</button></div>
        <div class="sp"></div>
        <button class="ib solo" id="scrollBtn" aria-label="Автопрокрутка">▶ Прокрутка</button>
      </div>
      <div class="chordrow" id="chordRow"></div>
      <div class="lyrics" id="lyrics"></div>
    </div>`;
  st.tr=(prefs.tr||{})[SONG.id]||0;
  $('trDown').onclick=()=>setTr(-1);$('trUp').onclick=()=>setTr(1);
  $('fsDown').onclick=()=>{st.fs=Math.max(13,st.fs-2);prefs.fs=st.fs;savePrefs();drawSong();};
  $('fsUp').onclick=()=>{st.fs=Math.min(34,st.fs+2);prefs.fs=st.fs;savePrefs();drawSong();};
  $('scrollBtn').onclick=toggleScroll;
  drawSong();
}
function setTr(d){st.tr=Math.max(-11,Math.min(11,st.tr+d));prefs.tr=prefs.tr||{};prefs.tr[SONG.id]=st.tr;savePrefs();drawSong();}
function drawSong(){
  const t=SONG.text||'',tr=st.tr;
  $('trLabel').textContent=tr?(tr>0?'+':'')+tr:'Тон';
  $('lyrics').style.setProperty('--lf',st.fs+'px');
  $('chordRow').innerHTML=chordsIn(t).map(c=>transposeChord(c,tr)).map(c=>`<button data-chord="${esc(c)}" aria-label="Аккорд ${esc(c)}">${chordSVG(c)}</button>`).join('');
  let html='';
  t.split('\n').forEach(line=>{
    const cm=line.match(/^\s*\{(?:comment|c):\s*(.*)\}\s*$/i);
    if(cm){html+=`<span class="cm">${esc(cm[1])}</span>`;return;}
    if(/^\s*\{.*\}\s*$/.test(line))return;
    const parts=line.split(/(\[[^\]]+\])/),textOnly=parts.filter(p=>!/^\[/.test(p)).join('').trim()==='';
    let segs='',pend=null;
    const seg=(ch,txt)=>{const c=ch?`<button class="ch" data-chord="${esc(ch)}">${esc(ch)}</button>`:(textOnly?'':'<span class="ch">&nbsp;</span>');return textOnly?c:`<span class="sg">${c}<span>${esc(txt)||' '}</span></span>`;};
    parts.forEach(p=>{const m=p.match(/^\[([^\]]+)\]$/);
      if(m){if(pend!==null)segs+=seg(pend,'');pend=transposeChord(m[1].trim(),tr);return;}
      if(p===''&&pend===null)return;segs+=seg(pend,p);pend=null;});
    if(pend!==null)segs+=seg(pend,'');
    html+=`<div class="ln ${textOnly?'only':''}">${segs||'&nbsp;'}</div>`;
  });
  $('lyrics').innerHTML=html;
}
function stopScroll(){st.scroll=0;cancelAnimationFrame(st.raf);const b=$('scrollBtn');if(b){b.classList.remove('on');b.textContent='▶ Прокрутка';}}
function toggleScroll(){
  st.scroll=(st.scroll+1)%4;if(!st.scroll){stopScroll();return;}
  $('scrollBtn').classList.add('on');$('scrollBtn').textContent='▶'.repeat(st.scroll)+' Прокрутка';
  cancelAnimationFrame(st.raf);let last=performance.now(),acc=0;
  const step=t=>{const dt=t-last;last=t;acc+=dt*[0,14,26,42][st.scroll]/1000;const n=Math.floor(acc);if(n){window.scrollBy(0,n);acc-=n;}if(st.scroll)st.raf=requestAnimationFrame(step);};
  st.raf=requestAnimationFrame(step);
}
addEventListener('wheel',()=>{if(st.scroll)stopScroll();},{passive:true});
addEventListener('touchstart',()=>{if(st.scroll)stopScroll();},{passive:true});
document.addEventListener('click',e=>{const b=e.target.closest('[data-chord]');if(!b)return;
  const n=b.dataset.chord;$('popSvg').innerHTML=chordSVG(n,false);$('popName').textContent=n;$('pop').dataset.name=n;$('pop').hidden=false;strumChord(n);});
$('pop').addEventListener('click',e=>{if(e.target===$('pop'))$('pop').hidden=true;});
$('popPlay').onclick=()=>strumChord($('pop').dataset.name);

/* ===== таб-плеер (alphaTab, MPL-2.0) ===== */
const AT_DIR='vendor/alphatab/',SPEEDS=[1,.75,.5,1.25];
const SC=['#F26B6F','#F0A830','#E8D44D','#6FBF73','#5AB0E8','#B98AE8'];
let atApi=null;const tp={speedI:0,dur:0,score:null};
const colored=()=>prefs.tabColor!==false;
const horiz=()=>prefs.tabLayout==='line';
const zoom=()=>Math.min(1.5,Math.max(.6,prefs.tabZoom||1));
const scale=()=>(innerWidth<560?.92:1.1)*zoom();
const fmtT=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function loadAlphaTab(){return window.alphaTab?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src=AT_DIR+'alphaTab.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function colorScore(score){
  for(const t of score.tracks)for(const stv of t.staves){const n=stv.tuning&&stv.tuning.length||6;
    for(const b of stv.bars)for(const v of b.voices)for(const bt of v.beats)for(const nt of bt.notes){
      if(!nt.style)nt.style=new alphaTab.model.NoteStyle();
      const idx=Math.max(0,Math.min(5,nt.string-1-Math.max(0,n-6)));
      nt.style.colors.set(alphaTab.model.NoteSubElement.GuitarTabFretNumber,alphaTab.model.Color.fromJson(colored()?SC[idx]:'#EFECFB'));}}
}
function fixSurface(){
  const surf=$('atRender').querySelector('.at-surface');if(!surf)return;
  const last=surf.lastElementChild;
  if(last&&last.tagName==='DIV'&&(parseFloat(last.style.height)||99)<24&&surf.children.length>1){last.style.display='none';const top=parseFloat(last.style.top);if(top>0)surf.style.height=top+'px';}
  let w=0;for(const c of surf.children)w=Math.max(w,(parseFloat(c.style.left)||0)+(parseFloat(c.style.width)||c.offsetWidth));
  if(w>surf.offsetWidth+1){const px=Math.ceil(w+16)+'px';surf.style.width=px;const cu=$('atRender').querySelector('.at-cursors');if(cu)cu.style.width=px;}
}
function paintTabUI(){
  $('tSpeed').textContent=Math.round(SPEEDS[tp.speedI]*100)+'%';$('tSpeed').classList.toggle('on',SPEEDS[tp.speedI]!==1);
  $('tLoop').classList.toggle('on',!!(atApi&&atApi.isLooping));
  $('tMetro').classList.toggle('on',!!(atApi&&atApi.metronomeVolume>0));
  $('tCount').classList.toggle('on',!!(atApi&&atApi.countInVolume>0));
  $('tColor').textContent=colored()?'🎨 Цвет':'◻ Обычный';
  $('tLayout').textContent=horiz()?'⟶ Строка':'↵ Перенос';
  $('tView').textContent=prefs.tabView==='score'?'Ноты + таб':'Таб';
  $('legend').style.visibility=colored()?'':'hidden';
  $('tZo').disabled=zoom()<=.6+1e-6;$('tZi').disabled=zoom()>=1.5-1e-6;
}
function relayout(){if(!atApi)return;const d=atApi.settings.display;d.layoutMode=horiz()?alphaTab.LayoutMode.Horizontal:alphaTab.LayoutMode.Page;d.scale=scale();atApi.updateSettings();atApi.render();}
async function renderTabPage(){
  $('content').innerHTML=`
    <div class="shead"><div>
      <div class="badges">${SONG.exclusive?'<span class="type ex">★ Эксклюзив</span>':''}<span class="type tb">Таб</span><span class="type ver">✓ ditrihh</span></div>
      <h1>${esc(SONG.title)}</h1><div class="by">${esc(SONG.artist||'')}</div></div></div>
    <div class="panel">
      <div class="bar">
        <div class="legend" id="legend">${SC.map((c,i)=>`<span><i style="background:${c}"></i>${6-i}</span>`).join('')}</div>
        <select class="tracks" id="tTracks" hidden aria-label="Партия"></select>
        <div class="sp"></div>
        <div class="grp"><button class="ib" id="tZo" aria-label="Мельче">−</button><button class="ib" id="tZi" aria-label="Крупнее">+</button></div>
        <button class="ib solo" id="tColor"></button>
        <button class="ib solo" id="tLayout"></button>
        <button class="ib solo" id="tView"></button>
      </div>
      <div class="atwrap">
        <div id="atScroll"><div id="atRender"></div></div>
        <div class="loading" id="tLoading"><span class="spin"></span><span id="tLoadText">Загружаю таб…</span></div>
      </div>
      <div class="pbar">
        <button class="play" id="tPlay" disabled aria-label="Играть">▶</button>
        <span class="t" id="tCur">0:00</span><div class="prog" id="tProg"><i id="tFill"></i></div><span class="t" id="tEnd">0:00</span>
        <button class="ib solo" id="tSpeed" aria-label="Темп">100%</button>
        <button class="ib solo" id="tLoop" aria-label="Повтор">⟲ Повтор</button>
        <button class="ib solo" id="tMetro" aria-label="Метроном">♩ Метроном</button>
        <button class="ib solo" id="tCount" aria-label="Отсчёт">1-2 Отсчёт</button>
      </div>
      <div class="hint">Пробел — играть/пауза · выдели такты мышью, чтобы повторять участок</div>
    </div>`;
  paintTabUI();
  try{
    await loadAlphaTab();
    atApi=new alphaTab.AlphaTabApi($('atRender'),{
      core:{fontDirectory:AT_DIR+'font/',scriptFile:new URL(AT_DIR+'alphaTab.min.js',location.href).href,useWorkers:true},
      display:{staveProfile:prefs.tabView==='score'?'ScoreTab':'Tab',scale:scale(),layoutMode:horiz()?'Horizontal':'Page',
        resources:{staffLineColor:'#8A84D6',barSeparatorColor:'#A9A3E6',mainGlyphColor:'#EFECFB',secondaryGlyphColor:'#A4A1D8',barNumberColor:'#A4A1D8',tablatureFont:'bold 14px Manrope, Arial, sans-serif'}},
      notation:{rhythmMode:'ShowWithBars',rhythmHeight:22,elements:{scoreTitle:false,scoreSubTitle:false,scoreArtist:false,scoreAlbum:false,scoreWords:false,scoreMusic:false,scoreWordsAndMusic:false,scoreCopyright:false,guitarTuning:false,trackNames:false,effectDynamics:false}},
      player:{playerMode:'EnabledSynthesizer',soundFont:AT_DIR+'soundfont/sonivox.sf3',scrollElement:$('atScroll'),scrollOffsetY:-30,enableCursor:true,enableUserInteraction:true}
    });
    atApi.scoreLoaded.on(score=>{tp.score=score;colorScore(score);const tr=$('tTracks');tr.hidden=score.tracks.length<2;
      tr.innerHTML=score.tracks.map((t,i)=>`<option value="${i}">${esc(t.name||('Партия '+(i+1)))}</option>`).join('');});
    atApi.postRenderFinished.on(fixSurface);
    atApi.renderFinished.on(()=>{if(atApi.isReadyForPlayback)$('tLoading').hidden=true;else $('tLoadText').textContent='Загружаю звук гитары…';});
    atApi.soundFontLoad.on(e=>{if(e.total)$('tLoadText').textContent=`Загружаю звук гитары… ${Math.round(100*e.loaded/e.total)}%`;});
    atApi.playerReady.on(()=>{$('tLoading').hidden=true;$('tPlay').disabled=false;});
    atApi.playerStateChanged.on(e=>{const on=e.state===1;$('tPlay').textContent=on?'❚❚':'▶';$('tPlay').classList.toggle('pause',on);});
    atApi.playerPositionChanged.on(e=>{tp.dur=e.endTime;$('tCur').textContent=fmtT(e.currentTime);$('tEnd').textContent=fmtT(e.endTime);$('tFill').style.width=(e.endTime?100*e.currentTime/e.endTime:0)+'%';});
    atApi.error.on(e=>{$('tLoading').hidden=false;$('tLoadText').textContent='Не удалось открыть таб. Обнови страницу.';console.error('alphaTab',e);});
    const src=SONG.tab;
    if(/\.a?tex$/i.test(src)){atApi.tex(await (await fetch(src,{cache:'no-cache'})).text());}
    else atApi.load(new URL(src,location.href).href);
  }catch(e){$('tLoadText').textContent='Не удалось загрузить плеер. Проверь интернет и обнови страницу.';}
  $('tPlay').onclick=()=>atApi&&atApi.playPause();
  $('tSpeed').onclick=()=>{if(!atApi)return;tp.speedI=(tp.speedI+1)%SPEEDS.length;atApi.playbackSpeed=SPEEDS[tp.speedI];paintTabUI();};
  $('tLoop').onclick=()=>{if(!atApi)return;atApi.isLooping=!atApi.isLooping;paintTabUI();};
  $('tMetro').onclick=()=>{if(!atApi)return;atApi.metronomeVolume=atApi.metronomeVolume>0?0:1;paintTabUI();};
  $('tCount').onclick=()=>{if(!atApi)return;atApi.countInVolume=atApi.countInVolume>0?0:1;paintTabUI();};
  $('tColor').onclick=()=>{prefs.tabColor=!colored();savePrefs();paintTabUI();if(atApi&&tp.score){colorScore(tp.score);atApi.render();}};
  $('tLayout').onclick=()=>{prefs.tabLayout=horiz()?'page':'line';savePrefs();paintTabUI();relayout();$('atScroll').scrollTo(0,0);};
  $('tView').onclick=()=>{prefs.tabView=prefs.tabView==='score'?'tab':'score';savePrefs();paintTabUI();if(atApi){atApi.settings.display.staveProfile=prefs.tabView==='score'?alphaTab.StaveProfile.ScoreTab:alphaTab.StaveProfile.Tab;atApi.updateSettings();atApi.render();}};
  $('tZo').onclick=()=>{prefs.tabZoom=Math.round((zoom()-.1)*100)/100;savePrefs();paintTabUI();relayout();};
  $('tZi').onclick=()=>{prefs.tabZoom=Math.round((zoom()+.1)*100)/100;savePrefs();paintTabUI();relayout();};
  $('tTracks').onchange=e=>{if(atApi&&tp.score)atApi.renderTracks([tp.score.tracks[+e.target.value]]);};
  $('tProg').onclick=e=>{if(!atApi||!tp.dur)return;const r=e.currentTarget.getBoundingClientRect();atApi.timePosition=tp.dur*(e.clientX-r.left)/r.width;};
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'))return;
    if(e.code==='Space'||e.key===' '){e.preventDefault();if(!$('tPlay').disabled)$('tPlay').click();}
  });
}

/* ===== запуск ===== */
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  let list=[];try{list=await (await fetch('songs.json',{cache:'no-cache'})).json();}catch(e){}
  SONG=list.find(s=>s.id===id);
  if(!SONG){$('content').innerHTML='<div class="notfound"><h1>Песня не найдена</h1><p class="lead" style="margin:0 auto 24px">Возможно, ссылка устарела.</p><a class="btn main" href="songs.html">Все аккорды и табы</a></div>';return;}
  document.title=`${SONG.title}${SONG.artist?' — '+SONG.artist:''} — ${SONG.tab?'таб':'аккорды'} от ditrihh`;
  const md=document.querySelector('meta[name="description"]');if(md)md.content=`${SONG.title}${SONG.artist?' ('+SONG.artist+')':''}: ${SONG.tab?'таб со звуком':'аккорды со схемами'} от ditrihh — проверено на гитаре.`;
  if(SONG.tab)renderTabPage();else renderChordsPage();
})();
</script>
