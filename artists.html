  /* алфавит: прилипает под шапкой, на телефоне прокручивается вбок */
  .abc{position:sticky;top:72px;z-index:5;margin:26px 0 8px;padding:6px;border-radius:16px;background:rgba(12,10,36,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(110,123,255,.18);width:fit-content;max-width:100%}
  .abc .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.abc .row::-webkit-scrollbar{display:none}
  .abc a{flex:none;min-width:40px;height:40px;padding:0 10px;display:grid;place-items:center;border-radius:11px;background:var(--card);color:var(--paper);font:800 15px var(--body);text-decoration:none;transition:background .15s,color .15s}
  .abc a:hover{background:var(--card2);color:var(--amber)}
  .abc a.sep{margin-left:10px}
  .grp,.top{padding:0}
  .grp{scroll-margin-top:150px;margin-top:30px}
  .grp h2{font-family:var(--display);font-weight:400;font-size:30px;color:#B3AEE8;margin-bottom:12px;display:flex;align-items:center;gap:14px}
  .grp h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(110,123,255,.35),transparent)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .ac{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:linear-gradient(160deg,rgba(37,31,94,.75),rgba(20,17,55,.85));box-shadow:inset 0 0 0 1px rgba(110,123,255,.2);color:var(--paper);text-decoration:none;transition:transform .15s,box-shadow .15s}
  .ac:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(110,123,255,.5),0 10px 26px rgba(110,123,255,.18)}
  .ac .av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--body);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
  .ac b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:800;font-size:16px;line-height:1.25;overflow:hidden}
  .ac small{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-top:2px}
  .ac>span{min-width:0;flex:1}
  .ac .tags{display:flex;gap:5px;margin-top:6px}
  .ac .tags i{font-style:normal;font-weight:800;font-size:11px;letter-spacing:.4px;text-transform:uppercase;padding:3px 7px;border-radius:999px}
  .tags .ch{background:rgba(110,123,255,.2);color:#B3BAFF}.tags .tb{background:rgba(240,168,48,.18);color:#F3C06A}
  .ac .go{flex:none;color:var(--muted);font-weight:800;font-size:18px}
  .top{margin-top:26px}
  .top h2{font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#B3AEE8;margin-bottom:12px}
  .empty{color:var(--muted);font-weight:700;padding:30px 0}
  .ask{margin:40px 0 80px;padding:22px 24px;border-radius:20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(90deg,rgba(110,123,255,.18),rgba(255,95,207,.1))}
  .ask h3{font-family:var(--display);font-weight:400;font-size:22px}.ask p{color:#CFCCF2;margin-top:4px}
  @media (max-width:560px){.abc{top:70px}.cards{grid-template-columns:1fr}}

<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pl=(n,a,b,c)=>n%10===1&&n%100!==11?a:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c;
const PAL=[['#6E7BFF','#A06BFF'],['#F0A830','#F26B6F'],['#FF5FCF','#A06BFF'],['#6FBF73','#2A9D8F'],['#7CC4F2','#6E7BFF'],['#E8D44D','#F0A830']];
const hash=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return h;};
const ini=a=>a.replace(/[^\p{L}\p{N}\s]/gu,'').split(/\s+/).filter(Boolean).filter((w,i,arr)=>arr.length<2||w.length>2||i===0).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'♪';
// буква раздела: Ё → Е, цифры — «0–9», латиница и кириллица отдельно
const letter=a=>{const c=a.trim().charAt(0).toUpperCase();return c==='Ё'?'Е':/[0-9]/.test(c)?'0–9':/[A-ZА-Я]/.test(c)?c:'#';};
const card=([a,x])=>{const [c1,c2]=PAL[hash(a)%PAL.length];
  return `<a class="ac" href="songs.html?artist=${encodeURIComponent(a)}"><i class="av" style="background:linear-gradient(135deg,${c1},${c2})">${esc(ini(a))}</i><span><b>${esc(a)}</b><small>${x.n} ${pl(x.n,'песня','песни','песен')}</small><span class="tags">${x.ch?`<i class="ch">Аккорды</i>`:''}${x.tb?`<i class="tb">Табы</i>`:''}</span></span><span class="go">→</span></a>`;};
fetch('songs.json',{cache:'no-cache'}).then(r=>r.json()).then(list=>{
  const A=new Map();
  (Array.isArray(list)?list:[]).forEach(s=>{const a=(s.artist||'').trim();if(!a)return;const x=A.get(a)||{n:0,ch:0,tb:0};x.n++;s.tab?x.tb++:x.ch++;A.set(a,x);});
  const all=[...A].sort((p,q)=>p[0].localeCompare(q[0],'ru'));
  if(!all.length){$('lead').textContent='';$('list').innerHTML='<p class="empty">Исполнители скоро появятся.</p>';return;}
  const songs=all.reduce((t,[,x])=>t+x.n,0);
  $('lead').textContent=`${all.length} ${pl(all.length,'исполнитель','исполнителя','исполнителей')} · ${songs} ${pl(songs,'песня','песни','песен')}. Выбери букву или нажми на исполнителя.`;
  const G=new Map();all.forEach(e=>{const l=letter(e[0]);if(!G.has(l))G.set(l,[]);G.get(l).push(e);});
  const order=l=>/[А-Я]/.test(l)?0:/[A-Z]/.test(l)?1:l==='0–9'?2:3;
  const L=[...G.keys()].sort((p,q)=>order(p)-order(q)||p.localeCompare(q,'ru'));
  $('abc').innerHTML=L.map((l,i)=>`<a href="#l-${i}"${i&&order(l)!==order(L[i-1])?' class="sep"':''}>${l}</a>`).join('');
  // популярные — у кого больше всего песен (когда исполнителей набирается много)
  const pop=all.filter(e=>e[1].n>=3).sort((p,q)=>q[1].n-p[1].n).slice(0,6);
  if(all.length>=8&&pop.length>=2)$('top').innerHTML=`<section class="top"><h2>Больше всего песен</h2><div class="cards">${pop.map(card).join('')}</div></section>`;
  $('list').innerHTML=L.map((l,i)=>`<section class="grp" id="l-${i}"><h2>${l}</h2><div class="cards">${G.get(l).map(card).join('')}</div></section>`).join('');
}).catch(()=>{$('list').innerHTML='<p class="empty">Не удалось загрузить. Обнови страницу.</p>';});
</script>
