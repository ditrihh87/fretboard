<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Посты для ВК — ditrihh</title>
<meta name="theme-color" content="#0C0A24">
<link rel="icon" type="image/svg+xml" href="brand/ditrihh-icon.svg">
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<link rel="stylesheet" href="site.css">
<style>
  main{padding:40px 0 80px}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.5vw,44px);margin-bottom:6px}
  .lead{color:var(--muted);font-weight:600;margin-bottom:18px;max-width:760px;line-height:1.5}
  .lead a{color:var(--amber)}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
  .seg{display:inline-flex;gap:4px;background:rgba(28,24,72,.7);border-radius:14px;padding:4px}
  .seg button{border:none;background:transparent;color:var(--muted);font:800 14px var(--body);padding:9px 14px;border-radius:10px;cursor:pointer}
  .seg button.on{background:var(--amber);color:#1b1b1b}
  .list{display:flex;flex-direction:column;gap:14px}
  .post{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px;border-radius:18px;background:rgba(28,24,72,.7);box-shadow:inset 0 0 0 1px rgba(110,123,255,.2)}
  .post.done{opacity:.55}
  .post img{width:100%;border-radius:12px;display:block}
  .post pre{margin:0;white-space:pre-wrap;font:600 14px/1.5 var(--body);color:#E4E1F8;background:rgba(12,10,36,.55);border-radius:12px;padding:12px 14px;max-height:260px;overflow:auto}
  .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-weight:800}
  .meta small{color:var(--muted);font-weight:700}
  .tag{font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(110,123,255,.2);color:#B3BAFF}
  .tag.tb{background:rgba(240,168,48,.18);color:#F3C06A}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .btns .btn{padding:9px 14px;font-size:14px}
  .ok{color:#8FD493;font-weight:800;font-size:13px;align-self:center}
  .empty{color:var(--muted);font-weight:700;padding:20px 0}
  @media (max-width:760px){.post{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <h1>Посты для ВК</h1>
  <p class="lead">Служебная страница. Для каждой песни — готовый пост: скопируй текст, скачай обложку, вставь в группу <a href="https://vk.ru/ditrihh.guitar" target="_blank" rel="noopener">ВКонтакте</a> и поставь отложенную запись. Чтобы не частить — не больше 3 в день, удобно на то же время, что и в Дзене. Отметка «опубликовано» хранится в этом браузере.</p>
  <div class="bar"><div class="seg" id="seg"><button class="on" data-f="todo">Ещё не в ВК</button><button data-f="all">Все</button></div></div>
  <div class="list" id="list"><p class="empty">Загружаю…</p></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const owner=(()=>{try{const l=JSON.parse(localStorage.getItem('dgc_link')||'null');return !!(l&&l.prov==='admin');}catch(e){return false;}})();
const KEY='dgc_vk_done';
const done=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}};
const setDone=(id,v)=>{const d=done();if(v)d[id]=Date.now();else delete d[id];try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}};
const when=iso=>{try{return new Date(iso).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'});}catch(e){return '';}};
let P=[],F='todo';
function paint(){
  const d=done(),items=P.filter(p=>F==='all'||!d[p.id]);
  $('list').innerHTML=items.length?items.map(p=>`<article class="post${d[p.id]?' done':''}" data-id="${esc(p.id)}">
    <div>${p.cover?`<img src="${esc(p.cover)}" alt="">`:''}</div>
    <div><div class="meta"><span class="tag${p.tab?' tb':''}">${p.tab?'Таб':'Аккорды'}</span>${esc(p.title)}${p.artist?` <small>— ${esc(p.artist)}</small>`:''}<small>· в Дзене: ${when(p.at)}</small></div>
      <pre>${esc(p.text)}</pre>
      <div class="btns"><button class="btn main" data-copy>📋 Скопировать текст</button>${p.cover?`<a class="btn ghost" href="${esc(p.cover)}" download="${esc(p.id)}.jpg">🖼 Скачать обложку</a>`:''}
        <button class="btn ghost" data-done>${d[p.id]?'↩ Вернуть в список':'✓ Опубликовано в ВК'}</button><span class="ok" data-msg></span></div></div></article>`).join('')
    :'<p class="empty">Всё уже опубликовано 🎉</p>';
}
$('list').addEventListener('click',async e=>{
  const art=e.target.closest('.post');if(!art)return;const p=P.find(x=>x.id===art.dataset.id);
  if(e.target.closest('[data-copy]')){try{await navigator.clipboard.writeText(p.text);}catch(err){const t=document.createElement('textarea');t.value=p.text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
    art.querySelector('[data-msg]').textContent='Скопировано';setTimeout(()=>{const m=art.querySelector('[data-msg]');if(m)m.textContent='';},2000);}
  if(e.target.closest('[data-done]')){setDone(p.id,!done()[p.id]);paint();}
});
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;F=b.dataset.f;$('seg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));paint();});
if(!owner){$('list').innerHTML='<p class="empty">Эта страница — только для владельца сайта. <a href="login.html?admin" style="color:var(--amber)">Войти</a></p>';}
else fetch('vk-posts.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{P=j;paint();}).catch(()=>{$('list').innerHTML='<p class="empty">Не удалось загрузить посты.</p>';});
</script>
</body>
</html>
