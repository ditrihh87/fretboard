<script>
const $=id=>document.getElementById(id);
$('yr').textContent=new Date().getFullYear();
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* настройки страницы — только в этом браузере */
let prefs={};try{prefs=JSON.parse(localStorage.getItem('dgc_site')||'{}');}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('dgc_site',JSON.stringify(prefs));}catch(e){}};

/* ===== аккорды: разбор, транспонирование, схемы ===== */
const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11,H:11};
const SHARP=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
function parseChord(name){const m=String(name).trim().match(/^([A-H])([#b]?)(.*)$/);if(!m)return null;return {pc:(PC[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+12)%12,q:m[3]};}
function transposeChord(name,st){if(!st)return name;return name.split('/').map(p=>{const c=parseChord(p);return c?SHARP[(c.pc+st+120)%12]+c.q:p;}).join('/');}
/* «Простые аккорды»: переносим песню в Am/C или Em/G и ставим каподастр, чтобы звучало как в оригинале */
const EASY=new Set(['C','D','E','G','A','Am','Dm','Em','A7','B7','C7','D7','E7','G7','Am7','Dm7','Em7','Cmaj7','Gmaj7','Asus2','Asus4','Dsus2','Dsus4','Esus4','Hm7','B7']);
function easyCapo(list){
  const ch=[...new Set(list)];const f=ch.map(parseChord).find(Boolean);if(!f)return null;
  const minor=/^m(?!aj)/.test(f.q);
  let best=null;
  (minor?[9,4]:[0,7]).forEach(tg=>{ // Am, Em  |  C, G
    const k=(f.pc-tg+12)%12;
    const hard=ch.filter(c=>!EASY.has(transposeChord(c.split('/')[0],-k).replace(/^Bb/,'A#'))).length;
    if(!best||hard<best.hard||(hard===best.hard&&k<best.k))best={k,hard};
  });
  return best;
}
const normQ=q=>q.replace(/^min$/,'m').replace(/^maj$/,'').replace(/^-$/,'m');
const OPEN={
  'C':[-1,3,2,0,1,0],'A':[-1,0,2,2,2,0],'G':[3,2,0,0,0,3],'E':[0,2,2,1,0,0],'D':[-1,-1,0,2,3,2],
  'Am':[-1,0,2,2,1,0],'Em':[0,2,2,0,0,0],'Dm':[-1,-1,0,2,3,1],
  'E7':[0,2,0,1,0,0],'A7':[-1,0,2,0,2,0],'D7':[-1,-1,0,2,1,2],'G7':[3,2,0,0,0,1],'C7':[-1,3,2,3,1,0],'B7':[-1,2,1,2,0,2],
  'Am7':[-1,0,2,0,1,0],'Em7':[0,2,0,0,0,0],'Dm7':[-1,-1,0,2,1,1],
  'F':[1,3,3,2,1,1],'Fm':[1,3,3,1,1,1],'Bm':[-1,2,4,4,3,2],'Cmaj7':[-1,3,2,0,0,0],'Fmaj7':[-1,-1,3,2,1,0],
  'Asus4':[-1,0,2,2,3,0],'Gsus4':[3,3,0,0,1,3],'Csus4':[-1,3,3,0,1,1],'Dsus4':[-1,-1,0,2,3,3],'Esus4':[0,2,2,2,0,0],'Asus2':[-1,0,2,2,0,0],'Dsus2':[-1,-1,0,2,3,0],
};
const BARRE={E:{'':[0,2,2,1,0,0],m:[0,2,2,0,0,0],'7':[0,2,0,1,0,0],m7:[0,2,0,0,0,0]},A:{'':[-1,0,2,2,2,0],m:[-1,0,2,2,1,0],'7':[-1,0,2,0,2,0],m7:[-1,0,2,0,1,0]}};
function chordShape(name){
  const c=parseChord(name.split('/')[0]);if(!c)return null;
  const q=normQ(c.q),key=SHARP[c.pc]+q;
  if(OPEN[key])return OPEN[key];
  if(q==='5'){ // квинтаккорд: только от 6-й или 5-й струны; открытая — только толстая ми (E5)
    const f6=(c.pc-4+12)%12,f5=(c.pc-9+12)%12||12;
    return f6<=f5?[f6,f6+2,f6+2,-1,-1,-1]:[-1,f5,f5+2,f5+2,-1,-1];
  }
  if(!(q in BARRE.E))return null;
  const fe=(c.pc-4+12)%12||12,fa=(c.pc-9+12)%12||12;
  const [shape,fr]=fe<=fa?[BARRE.E[q],fe]:[BARRE.A[q],fa];
  return shape.map(x=>x<0?-1:x+fr);
}
function chordSVG(name,label=true){
  const f=chordShape(name);
  if(!f)return `<svg viewBox="0 0 62 76"><text x="31" y="44" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">нет схемы</text>${label?`<text x="31" y="72" text-anchor="middle" font-size="12" font-weight="800" fill="currentColor">${esc(name)}</text>`:''}</svg>`;
  const pos=f.filter(x=>x>0),max=Math.max(0,...pos),min=pos.length?Math.min(...pos):1,base=max<=4?1:min;
  const X=i=>9+i*9,Y=k=>14+k*10;let g='';
  for(let k=0;k<=5;k++)g+=`<line x1="9" x2="54" y1="${Y(k)}" y2="${Y(k)}" stroke="currentColor" stroke-width="${k===0&&base===1?2.6:1}" opacity="${k===0&&base===1?1:.55}"/>`;
  for(let i=0;i<6;i++)g+=`<line x1="${X(i)}" x2="${X(i)}" y1="14" y2="64" stroke="currentColor" stroke-width="1" opacity=".55"/>`;
  let barreFr=0,barreX=31,barreY=0,barreA=-1,barreB=-1;const played=f.map((v,i)=>[v,i]).filter(([v])=>v>=0);
  if(min>0&&played.length>=4){const onMin=played.filter(([v])=>v===min).map(([,i])=>i),first=played[0][1],last=played[played.length-1][1];
    if(onMin.includes(first)&&onMin.includes(last)&&onMin.length>=2)barreFr=min,barreY=Y(min-base)+5,barreA=first,barreB=last,g+=`<rect x="${X(first)-3}" y="${Y(min-base)+2}" width="${X(last)-X(first)+6}" height="6" rx="1.5" fill="#F0A830"/>`;}
  f.forEach((v,i)=>{
    if(v<0)g+=`<text x="${X(i)}" y="10" text-anchor="middle" font-size="8" font-weight="800" fill="currentColor" opacity=".75">✕</text>`;
    else if(v===0)g+=`<circle cx="${X(i)}" cy="7.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.2"/>`;
    else if(!(barreFr&&v===barreFr&&i>=barreA&&i<=barreB))g+=`<circle cx="${X(i)}" cy="${Y(v-base)+5}" r="3.6" fill="#F0A830"/>`;});
  if(base>1&&!barreFr)g+=`<text x="58" y="${Y(0)+8}" font-size="7.5" font-weight="800" fill="currentColor">${base}</text>`;
  // баррэ: номер лада справа от полоски, на её уровне
  const bh=0;
  if(barreFr)g+=`<text x="${X(5)+5}" y="${barreY+3}" font-size="8.5" font-weight="800" fill="currentColor">${barreFr}</text>`;
  if(label)g+=`<text x="31" y="${74+bh}" text-anchor="middle" font-size="11" font-weight="800" fill="currentColor">${esc(name)}</text>`;
  return `<svg viewBox="0 0 66 ${(label?78:68)+bh}">${g}</svg>`;
}
const chordsIn=t=>[...new Set([...(t||'').matchAll(/\[([^\]]+)\]/g)].map(m=>m[1].trim()).filter(x=>parseChord(x)))];

/* ===== звук аккорда: семплы акустики ===== */
const SAMPLES='A2 A3 A4 As2 As3 As4 B2 B3 B4 C3 C4 C5 Cs3 Cs4 Cs5 D2 D3 D4 D5 Ds2 Ds3 Ds4 E2 E3 E4 F2 F3 F4 Fs2 Fs3 Fs4 G2 G3 G4 Gs2 Gs3 Gs4'.split(' ');
const NPC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const smidi=n=>{const m=n.match(/^([A-G])(s?)(\d)$/);return 12*(+m[3]+1)+NPC[m[1]]+(m[2]?1:0);};
const OPENM=[40,45,50,55,59,64]; // E2 A2 D3 G3 B3 E4
let actx=null;const bank=new Map();
function ctx(){if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();SAMPLES.forEach(n=>fetch(`samples/acoustic/${n}.mp3`).then(r=>r.arrayBuffer()).then(b=>new Promise((res,rej)=>actx.decodeAudioData(b,res,rej))).then(buf=>bank.set(smidi(n),buf)).catch(()=>{}));}if(actx.state==='suspended')actx.resume();return actx;}
function playMidi(m,when){
  const a=ctx();let best=null,d=99;for(const k of bank.keys()){const x=Math.abs(k-m);if(x<d){d=x;best=k;}}
  if(best===null)return;
  const s=a.createBufferSource(),gn=a.createGain();s.buffer=bank.get(best);s.playbackRate.value=Math.pow(2,(m-best)/12);
  gn.gain.value=.7;s.connect(gn).connect(a.destination);s.start(a.currentTime+when);
}
function strumChord(name){const f=chordShape(name);if(!f)return;ctx();setTimeout(()=>f.forEach((fr,c)=>{if(fr>=0)playMidi(OPENM[c]+fr,c*.11);}),bank.size?0:400);}

        <select class="tracks" id="tTracks" hidden aria-label="Партия"></select>
        <div class="sp"></div>
        <button class="ib solo" id="tZo" title="Мельче" aria-label="Мельче">${btnHTML('zoomOut','Мельче')}</button><button class="ib solo" id="tZi" title="Крупнее" aria-label="Крупнее">${btnHTML('zoomIn','Крупнее')}</button>
        <button class="ib solo" id="tColor" title="Цветные струны" aria-label="Цветные струны"></button>
        <button class="ib solo" id="tLayout" title="Перенос строк" aria-label="Перенос строк"></button>
        <button class="ib solo" id="tView" title="Таб или ноты" aria-label="Таб или ноты"></button>
        <button class="ib solo" id="tFull" title="Во весь экран" aria-label="Во весь экран">${ICONS.full}</button>
      </div>
      <div class="atwrap">
        <div id="atScroll"><div id="atRender"></div></div>
        <div class="loading" id="tLoading"><span class="spin"></span><span id="tLoadText">Загружаю таб…</span></div>
      </div>
      <div class="pbar">
        <button class="play" id="tPlay" disabled aria-label="Играть">▶</button><button class="ib solo rs" id="tRestart" title="Сначала" aria-label="Сначала">${ICONS.restart}</button>
        <span class="t" id="tCur">0:00</span><div class="prog" id="tProg"><i id="tFill"></i></div><span class="t" id="tEnd">0:00</span>
        <button class="ib solo" id="tSpeed" title="Темп" aria-label="Темп">100%</button>
        <button class="ib solo" id="tLoop" title="Повтор (выдели такты мышкой или пальцем)" aria-label="Повтор">${btnHTML('loop','Повтор')}</button>
        <button class="ib solo" id="tMetro" title="Метроном" aria-label="Метроном">${btnHTML('metro','Метроном')}</button>
        <button class="ib solo" id="tCount" title="Отсчёт перед началом" aria-label="Отсчёт">${btnHTML('count','Отсчёт')}</button>
      </div>
      <div class="hint">Пробел — играть/пауза · выдели такты мышью, чтобы повторять участок</div>
    </div>`;
  paintTabUI();
  try{
    await loadAlphaTab();
    atApi=new alphaTab.AlphaTabApi($('atRender'),{
      core:{fontDirectory:AT_DIR+'font/',scriptFile:AT_DIR+'alphaTab.min.js',useWorkers:true},
      display:{staveProfile:prefs.tabView==='score'?'ScoreTab':'Tab',scale:scale(),layoutMode:horiz()?'Horizontal':'Page',
        resources:{engravingSettings:{tabLineSpacing:16},staffLineColor:'rgba(138,132,214,0.38)',barSeparatorColor:'rgba(169,163,230,0.6)',mainGlyphColor:'rgba(196,190,240,0.62)',secondaryGlyphColor:'#A4A1D8',barNumberColor:'#A4A1D8',tablatureFont:'bold 15px Manrope, Arial, sans-serif'}},
      notation:{rhythmMode:'ShowWithBars',rhythmHeight:22,elements:{scoreTitle:false,scoreSubTitle:false,scoreArtist:false,scoreAlbum:false,scoreWords:false,scoreMusic:false,scoreWordsAndMusic:false,scoreCopyright:false,guitarTuning:false,trackNames:false,effectDynamics:false,effectCapo:false}},
      player:{playerMode:'EnabledSynthesizer',soundFont:AT_DIR+'soundfont/sonivox.sf3',scrollElement:$('atScroll'),scrollOffsetY:-30,enableCursor:true,enableUserInteraction:true}
    });
    atApi.scoreLoaded.on(score=>{tp.score=score;
      /* все гитары звучат как акустика со стальными струнами: нейлон (24) → сталь (25) */
      score.tracks.forEach(t=>{if(t.playbackInfo&&t.playbackInfo.program===24)t.playbackInfo.program=25;});
      /* темп в табе — только «♩ = 100», без словесных пометок вроде Moderate */
      score.masterBars.forEach(mb=>(mb.tempoAutomations||[]).forEach(a=>{a.text='';}));if(score.tempoLabel!==undefined)score.tempoLabel='';
      colorScore(score);tuneInfo(score);const tr=$('tTracks');tr.hidden=score.tracks.length<2;
      tr.innerHTML=score.tracks.map((t,i)=>`<option value="${i}">${esc(t.name||('Партия '+(i+1)))}</option>`).join('');});
    atApi.postRenderFinished.on(fixSurface);
    atApi.renderFinished.on(()=>{if(atApi.isReadyForPlayback)$('tLoading').hidden=true;else $('tLoadText').textContent='Загружаю звук гитары…';});
    atApi.soundFontLoad.on(e=>{if(e.total)$('tLoadText').textContent=`Загружаю звук гитары… ${Math.round(100*e.loaded/e.total)}%`;});
    atApi.playerReady.on(()=>{$('tLoading').hidden=true;$('tPlay').disabled=false;});
    atApi.playerStateChanged.on(e=>{const on=e.state===1;$('tPlay').textContent=on?'❚❚':'▶';$('tPlay').classList.toggle('pause',on);});
    atApi.playerPositionChanged.on(e=>{tp.dur=e.endTime;$('tCur').textContent=fmtT(e.currentTime);$('tEnd').textContent=fmtT(e.endTime);$('tFill').style.width=(e.endTime?100*e.currentTime/e.endTime:0)+'%';});
    atApi.error.on(e=>{$('tLoading').hidden=false;$('tLoadText').textContent='Не удалось открыть таб. Обнови страницу.';console.error('alphaTab',e);});
    const src=SONG.tab;
    if(/\.a?tex$/i.test(src)){atApi.tex(await (await fetch(src,{cache:'no-cache'})).text());}
    else atApi.load(new URL(src,document.baseURI).href);
  }catch(e){$('tLoadText').textContent='Не удалось загрузить плеер. Проверь интернет и обнови страницу.';}
  $('tPlay').onclick=()=>atApi&&atApi.playPause();
  /* во весь экран: настоящий fullscreen, где браузер умеет, иначе (iPhone) — растягиваем плеер на всё окно */
  const panel=$('tFull').closest('.panel');
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const paintFull=on=>{panel.classList.toggle('full',on);document.body.classList.toggle('tfull',on);
    $('tFull').innerHTML=on?ICONS.unfull:ICONS.full;$('tFull').title=on?'Свернуть':'Во весь экран';$('tFull').setAttribute('aria-label',$('tFull').title);$('tFull').classList.toggle('on',on);
    setTimeout(relayout,120);};
  $('tFull').onclick=()=>{
    if(panel.classList.contains('full')){if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);paintFull(false);return;}
    const req=panel.requestFullscreen||panel.webkitRequestFullscreen;
    if(req){try{const r=req.call(panel);if(r&&r.catch)r.catch(()=>{});}catch(e){}}
    paintFull(true);
  };
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&panel.classList.contains('full'))paintFull(false);}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('full')&&!fsEl())paintFull(false);});
  $('tRestart').onclick=()=>{if(!atApi)return;const playing=atApi.playerState===1;atApi.stop();$('atScroll').scrollTo(0,0);if(playing)setTimeout(()=>atApi.play(),60);};
  $('tSpeed').onclick=()=>{if(!atApi)return;tp.speedI=(tp.speedI+1)%SPEEDS.length;atApi.playbackSpeed=SPEEDS[tp.speedI];paintTabUI();};
  $('tLoop').onclick=()=>{if(!atApi)return;atApi.isLooping=!atApi.isLooping;paintTabUI();};
  $('tMetro').onclick=()=>{if(!atApi)return;atApi.metronomeVolume=atApi.metronomeVolume>0?0:1;paintTabUI();};
  $('tCount').onclick=()=>{if(!atApi)return;atApi.countInVolume=atApi.countInVolume>0?0:1;paintTabUI();};
  $('tColor').onclick=()=>{prefs.tabColor=!colored();savePrefs();paintTabUI();if(atApi&&tp.score){colorScore(tp.score);atApi.render();}};
  $('tLayout').onclick=()=>{prefs.tabLayout=horiz()?'page':'line';savePrefs();paintTabUI();relayout();$('atScroll').scrollTo(0,0);};
  $('tView').onclick=()=>{prefs.tabView=prefs.tabView==='score'?'tab':'score';savePrefs();paintTabUI();if(atApi){atApi.settings.display.staveProfile=prefs.tabView==='score'?alphaTab.StaveProfile.ScoreTab:alphaTab.StaveProfile.Tab;atApi.updateSettings();atApi.render();}};
  $('tZo').onclick=()=>{prefs.tabZoom=Math.round((zoom()-.1)*100)/100;savePrefs();paintTabUI();relayout();};
  $('tZi').onclick=()=>{prefs.tabZoom=Math.round((zoom()+.1)*100)/100;savePrefs();paintTabUI();relayout();};
  $('tTracks').onchange=e=>{if(atApi&&tp.score)atApi.renderTracks([tp.score.tracks[+e.target.value]]);};
  $('tProg').onclick=e=>{if(!atApi||!tp.dur)return;const r=e.currentTarget.getBoundingClientRect();atApi.timePosition=tp.dur*(e.clientX-r.left)/r.width;};
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'))return;
    if(e.code==='Space'||e.key===' '){e.preventDefault();if(!$('tPlay').disabled)$('tPlay').click();}
  });
}

/* ===== запуск ===== */
(async()=>{
  const id=window.SONG_ID||new URLSearchParams(location.search).get('id');
  let list=[];try{list=await (await fetch('songs.json',{cache:'no-cache'})).json();}catch(e){}
  SONG=list.find(s=>s.id===id);
  // старые ссылки song.html?id=… — на постоянную страницу песни (её создаёт scripts/build-songs.mjs)
  if(SONG&&!window.SONG_ID){location.replace((SONG.tab?'taby/':'akkordy/')+encodeURIComponent(SONG.id)+'.html'+location.hash);return;}
  if(!SONG){$('content').innerHTML='<div class="notfound"><h1>Песня не найдена</h1><p class="lead" style="margin:0 auto 24px">Возможно, ссылка устарела.</p><a class="btn main" href="songs.html?type=chords">Все аккорды</a> <a class="btn ghost" href="songs.html?type=tab">Все табы</a></div>';return;}
  if(!window.SONG_ID){document.title=`${SONG.title}${SONG.artist?' — '+SONG.artist:''} — ${SONG.tab?'таб':'аккорды'} от ditrihh`;}
  const md=window.SONG_ID?null:document.querySelector('meta[name="description"]');if(md)md.content=`${SONG.title}${SONG.artist?' ('+SONG.artist+')':''}: ${SONG.tab?'таб со звуком':'аккорды со схемами'} от ditrihh — проверено на гитаре.`;
  { const t=SONG.tab?'tab':'chords',c=$('crumb'); // «назад» и меню — в свой раздел
    if(c){c.href='songs.html?type='+t;c.textContent=SONG.tab?'← Все табы':'← Все аккорды';}
    document.querySelectorAll(`[data-nav="${t}"]`).forEach(a=>a.classList.add('on')); }
  if(SONG.tab)renderTabPage();else renderChordsPage();
  paintRate();paintYm();
})();
</script>
</body>
</html>
