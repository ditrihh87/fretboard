# Пересобирает страницы песен (akkordy/, taby/) и sitemap.xml при каждом изменении songs.json
name: Страницы песен
on:
  push:
    branches: [main]
    paths: ['songs.json', 'song.html', 'scripts/build-songs.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-songs
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-songs.mjs
      - name: Сохранить страницы
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A akkordy taby sitemap.xml
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "Страницы песен: пересборка"
          git pull --rebase origin main
          git push
